# █▄▄ █▄█ █▄█ █░█   █▀█ █░▀█ █▄▀   █▀░ ██▄ ██▄ █▄▄


general {
    gaps_in = 10
    gaps_out = 15

    border_size = 1

    col.active_border = rgba(ffffffff)
    col.inactive_border = rgba(020202bf)

    resize_on_border = true

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 15
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 3
        render_power = 1
        color = rgba(100,100,100,1)
    }

    blur {
        enabled = true
        size = 5
        passes = 2

        vibrancy = 0.1696
    }
}

dwindle {
    pseudotile = true 
    preserve_split = true 
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 
    disable_hyprland_logo = false 
}

