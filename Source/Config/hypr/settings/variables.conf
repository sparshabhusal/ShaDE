# Cursor variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,20

# Make Firefox Faster
env = MOZ_ENABLE_WAYLAND=1

# Make Vscode (Code-OSS) faster
env = GDK_BACKEND,wayland,x11,*


# NVIDIA lifesupport
env = GBM_BACKEND,nvidia-drm
env = WLR_NO_HARDWARE_CURSORS,1


# Prevent cursor from lagging !
env = no_hardware_cursors 0

cursor {
 no_hardware_cursors = true
}

